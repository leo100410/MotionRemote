name: MotionRemote
options:
  deploymentTarget:
    iOS: '17.2'
targets:
  MotionRemote:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leolange.motionremote
        SWIFT_VERSION: '5.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.20"
        CURRENT_PROJECT_VERSION: 20
        DEVELOPMENT_LANGUAGE: en
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        CFBundleDisplayName: MotionRemote
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Connects to Dolphin over Bluetooth to send controller inputs and receive game rumble.
        NSBonjourServices: [_motionremote._udp]
        NSLocalNetworkUsageDescription: Sends controller inputs directly to Dolphin on your local network.
        NSMotionUsageDescription: Uses motion and rotation to control your emulated Wii Remote.
        NSCameraUsageDescription: Enables the volume trigger and optional spatial tracking of the phone and screen. No camera images are saved or transmitted.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
